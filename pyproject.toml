[project]
name = "servery"
version = "0.1.0"
description = "A local inference server that keeps several models resident side by side under a fixed memory quota."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Piotr Trochim" }]
keywords = ["inference", "transformers", "local-models", "mps", "apple-silicon"]
dependencies = [
    "accelerate>=1.0",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=4.45",
]

[project.urls]
Homepage = "https://github.com/robodatalab/servery"
Source = "https://github.com/robodatalab/servery"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servery"]

[dependency-groups]
dev = [
    "types-tqdm>=4.69.0.20260720",
]
