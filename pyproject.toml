[project]
name = "vramen"
version = "0.2.2"
description = "A local inference server that keeps several models resident side by side under a fixed memory quota."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Piotr Trochim" }]
keywords = [
    "inference",
    "transformers",
    "local-models",
    "model-serving",
    "mps",
    "apple-silicon",
    "text-to-image",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "accelerate>=1.0",
    "torch>=2.5",
    "tqdm>=4.66",
    "transformers>=4.45,<6",
]

# Drawing is an extra. `diffusers` brings Pillow, and the T5 encoders these
# pipelines use are still shipped as a sentencepiece model, which needs
# `protobuf` to be read. A package that only ever generates text carries none
# of it.
[project.optional-dependencies]
image = [
    "diffusers>=0.36",
    "pillow>=10.0",
    "protobuf>=4.25",
    "sentencepiece>=0.2",
]

[project.urls]
Homepage = "https://github.com/robodatalab/vramen"
Source = "https://github.com/robodatalab/vramen"
Issues = "https://github.com/robodatalab/vramen/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vramen"]

[tool.hatch.build.targets.sdist]
include = ["src/vramen", "tests", "README.md", "LICENSE", "NOTICE"]

[dependency-groups]
dev = [
    "types-tqdm>=4.69.0.20260720",
]
