name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    # Must match the environment name configured on the PyPI trusted publisher.
    environment: pypi
    permissions:
      # Lets the job mint the short-lived OIDC token PyPI exchanges for an
      # upload credential. No API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Build the sdist and the wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
