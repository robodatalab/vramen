name: tests

# Pull requests only, which is once per commit. A branch with a PR open on it
# already re-runs this on every push, since `pull_request` fires on synchronize
# too, and triggering on `push` as well would run the whole matrix twice over
# the same commit. Main is covered by the publish workflow, which runs the same
# suite as the gate in front of a release.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A branch only needs an answer about its newest commit. Superseded runs are
# cancelled rather than queued, which is the opposite of the publish workflow,
# where a half-finished run leaves tags and the index disagreeing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    # ubuntu rather than macOS, even though macOS on arm64 is what the package
    # is built for: this is the same runner and the same command the publish
    # workflow gates a release on, so a green check here means that gate passes.
    # The suite stubs out every load path, so it never touches MPS anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full semver tags, no floating major.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # The floor in pyproject.toml, so what passes here passes on every
          # version the package claims to support.
          python-version: "3.12"
          enable-cache: true
          # uv.lock is gitignored, so pyproject.toml is the file that decides
          # what gets resolved, and the cache key has to follow it. The default
          # glob watches the lock file, which is never there.
          cache-dependency-glob: pyproject.toml

      # The same two commands the README gives for a checkout on a laptop.
      # `uv sync` installs the project editable into .venv from pyproject.toml,
      # with the dev group and without the image extra, which the suite does not
      # need: diffusers is imported inside the load path the tests stub out.
      - name: Install the dependencies
        run: uv sync

      - name: Run the tests
        # --no-sync because the step above already did it; unittest discovers
        # from tests/ with the repository root as the import root.
        run: uv run --no-sync python -m unittest discover -s tests -t . -v
